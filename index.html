
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prashant AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101522;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 750px;
    height: 95vh;
    background: #192235;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    background: #202e46;
    padding: 20px;
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    border-bottom: 1px solid #34445d;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    padding: 13px 16px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #2b3a52;
    margin-right: auto;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #202e46;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 10px;
    font-size: 16px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 0 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

@media (max-width: 600px) {
    .app {
        height: 100vh;
        border-radius: 0;
    }

    header {
        font-size: 20px;
    }

    .input-area {
        padding: 10px;
    }

    button {
        padding: 0 15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>🤖 Prashant AI Assistant</header>

<div id="chat">
    <div class="message bot">
        नमस्ते! 👋 मैं Prashant AI हूँ।
        बताइए, मैं आपकी क्या मदद कर सकता हूँ?
    </div>
</div>

<div class="input-area">
    <input
        type="text"
        id="userInput"
        placeholder="अपना सवाल लिखें..."
        autocomplete="off"
    >
    <button id="sendBtn" onclick="sendMessage()">
        Send
    </button>
</div>

</div>

<script>

// ===================================
// GEMINI API CONFIGURATION
// ===================================

// अपनी Gemini API Key यहाँ डालें।
const API_KEY = "YOUR_GEMINI_API_KEY";

// Gemini model
const MODEL = "gemini-3.8-flash";

// Gemini API URL
const API_URL =
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

// Chat history
const history = [];

async function sendMessage() {

    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const button = document.getElementById("sendBtn");

    const message = input.value.trim();

    if (!message || button.disabled) return;

    if (API_KEY === "YOUR_GEMINI_API_KEY") {
        alert("कृपया अपनी Gemini API Key डालें।");
        return;
    }

    addMessage(message, "user");
    input.value = "";

    button.disabled = true;

    const loadingMessage = addMessage(
        "AI सोच रहा है...",
        "bot"
    );

    try {

        // Current user message जोड़ें
        const contents = [
            ...history,
            {
                role: "user",
                parts: [{ text: message }]
            }
        ];

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": API_KEY
            },

            body: JSON.stringify({

                systemInstruction: {
                    parts: [{
                        text: "आप Prashant AI हैं। उपयोगकर्ता से हिंदी में विनम्रता से बात करें। उपयोगकर्ता जिस भाषा में प्रश्न करे, उसी भाषा में जवाब दें।"
                    }]
                },

                contents: contents,

                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 2048
                }

            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Gemini API request failed"
            );
        }

        const reply =
            data.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("")
                .trim();

        if (!reply) {
            throw new Error("AI से कोई जवाब नहीं मिला।");
        }

        loadingMessage.textContent = reply;

        // Conversation history update
        history.push(
            {
                role: "user",
                parts: [{ text: message }]
            },
            {
                role: "model",
                parts: [{ text: reply }]
            }
        );

    } catch (error) {

        loadingMessage.textContent =
            "❌ AI से कनेक्शन नहीं हो पाया।\n" +
            error.message;

        console.error("Gemini Error:", error);

    } finally {

        button.disabled = false;
        input.focus();

        chat.scrollTop = chat.scrollHeight;
    }
}

function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}

document.getElementById("userInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
